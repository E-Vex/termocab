name: Release

# Cut a release by tagging main: git tag vX.Y.Z && git push origin vX.Y.Z
# (the full process — semver policy for course content, setup, recovery —
# lives in RELEASE.md, decision D20 in HANDOFF.md §7).

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: tests
        run: cargo test

      - name: release build
        run: cargo build --release

      - name: publish dry run
        run: cargo publish --dry-run

  publish:
    name: crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set — see RELEASE.md § Setup (owner, once). The tag is fine to retry after setting it: a failed publish consumes nothing."
            exit 1
          fi
          cargo publish

  artifacts:
    name: binaries (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: release build
        run: cargo build --release

      - name: stage binary
        shell: bash
        run: |
          mkdir -p stage
          os="linux"
          if [ "${{ runner.os }}" = "macOS" ]; then os="macos"; fi
          cp target/release/termocab "stage/termocab-${GITHUB_REF_NAME}-${os}-$(uname -m)"

      - name: attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: stage/*
          generate_release_notes: true
